# azure-pipeline.yml

# Spring PetClinic - Build and Deploy Pipeline
# Module 2.2 - Workload Identity Federation Test

trigger:
- main-login

pool:
  name: Default

stages:

# =========================================================
# BUILD STAGE
# =========================================================

- stage: Build
  displayName: 'Build Stage'

  jobs:
  - job: BuildJob
    displayName: 'Build Job'

    steps:

    - checkout: self

    # =====================================================
    # AZURE WIF AUTHENTICATION TEST
    # =====================================================

    - task: AzureCLI@2
      displayName: 'Test Azure WIF Authentication'
      inputs:
        azureSubscription: 'PetClinic-AzureRM'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "=========================================="
          Write-Host "Azure WIF Authentication Test"
          Write-Host "=========================================="

          az account show --output table

          Write-Host ""
          Write-Host "Azure Subscription:"
          az account show --query name --output tsv

          Write-Host ""
          Write-Host "Azure Tenant:"
          az account show --query tenantId --output tsv


    - task: Maven@4
      displayName: 'Build Spring PetClinic'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package -DskipTests'
        publishJUnitResults: false
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'
        mavenVersionOption: 'Default'

    - task: CopyFiles@2
      displayName: 'Copy JAR to Artifact Staging Directory'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)/target'
        Contents: '*.jar'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'PetClinic'
        publishLocation: 'Container'

    - script: |
       echo "Checking target directory..."
       dir target
      displayName: 'Verify Maven Target Directory'

    - script: docker build -t petclinic:latest .
      displayName: 'Build Docker Image'


# =========================================================
# DEPLOY STAGE
# =========================================================

- stage: Deploy
  displayName: 'Deploy Stage'

  dependsOn: Build

  jobs:
  - job: DeployJob
    displayName: 'Deploy Job'

    steps:

    - checkout: self

    - script: docker build -t petclinic:latest .
      displayName: 'Build Docker Image'

    - script: kubectl apply -f deployment.yaml
      displayName: 'Deploy Deployment'

    - script: kubectl apply -f service.yaml
      displayName: 'Deploy Service'
